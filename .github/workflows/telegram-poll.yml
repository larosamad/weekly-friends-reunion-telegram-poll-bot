name: Telegram weekly poll

on:
  schedule:
    # Domenica — start
    # UTC+1 inverno: 11:00 IT = 10:00 UTC
    # UTC+2 estate: 12:00 IT = 10:00 UTC
    - cron: "0 10 * * 0"

    # Lunedì mattina — close_first
    # UTC+1 inverno: 09:00 IT = 08:00 UTC
    # UTC+2 estate: 10:00 IT = 08:00 UTC
    - cron: "0 8 * * 1"

    # Lunedì pomeriggio — close_tiebreak
    # UTC+1 inverno: 17:00 IT = 16:00 UTC
    # UTC+2 estate: 18:00 IT = 16:00 UTC
    - cron: "0 16 * * 1"

  workflow_dispatch:
    inputs:
      mode:
        description: "MODE da eseguire"
        required: true
        default: "start"
        type: choice
        options:
          - start
          - close_first
          - close_tiebreak

permissions:
  contents: write

concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 evita problemi di rebase/push su clone shallow
          # quando ci sono più run ravvicinati
          fetch-depth: 0
          persist-credentials: true

      # Per i run automatici NON guardiamo l'ora effettiva del runner.
      # Usiamo direttamente il cron che ha generato l'evento.
      #
      # Questo evita che un run GitHub partito in ritardo venga
      # erroneamente interpretato come close_tiebreak invece di close_first.
      - name: Decide mode (schedule)
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Cron che ha attivato il workflow: $SCHEDULE"

          case "$SCHEDULE" in
            "0 10 * * 0")
              echo "MODE=start" >> "$GITHUB_ENV"
              echo "Modalità selezionata: start"
              ;;

            "0 8 * * 1")
              echo "MODE=close_first" >> "$GITHUB_ENV"
              echo "Modalità selezionata: close_first"
              ;;

            "0 16 * * 1")
              echo "MODE=close_tiebreak" >> "$GITHUB_ENV"
              echo "Modalità selezionata: close_tiebreak"
              ;;

            *)
              echo "::warning::Cron non riconosciuto: $SCHEDULE"
              echo "MODE=" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Set mode (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          echo "Modalità manuale selezionata: ${{ inputs.mode }}"

      - name: Skip if no mode
        if: env.MODE == ''
        run: |
          echo "MODE non impostato: nessuna azione da eseguire per questo trigger."
          exit 0

      - name: Debug
        if: env.MODE != ''
        run: |
          echo "MODE=$MODE"
          echo "Evento GitHub: ${{ github.event_name }}"
          echo "Cron evento: ${{ github.event.schedule }}"
          echo "poll_info.json: $(test -f poll_info.json && cat poll_info.json || echo 'non esiste')"

      - uses: actions/setup-python@v5
        if: env.MODE != ''
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: env.MODE != ''
        run: pip install -r requirements.txt

      - name: Run bot
        if: env.MODE != ''
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MODE: ${{ env.MODE }}
        run: python bot.py

      - name: Save poll info
        if: env.MODE == 'start' || env.MODE == 'close_first'
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f poll_info.json ]; then
            git add poll_info.json
          else
            git rm --ignore-unmatch poll_info.json
          fi

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          git commit -m "Save poll info [skip ci]"

          # Riprova il rebase fino a 5 volte nel caso in cui
          # il branch main sia cambiato nel frattempo.
          for i in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main; then
              echo "Rebase riuscito."
              break
            fi

            echo "Rebase fallito, tentativo $i/5..."
            git rebase --abort || true
            sleep 3
          done

          if git push origin HEAD:main; then
            echo "Push riuscito."
          else
            echo "::error::git push fallito con permessi insufficienti o conflitto irrisolvibile."
            echo "::error::Verifica Settings -> Actions -> General -> Workflow permissions = 'Read and write permissions'."
            exit 1
          fi
