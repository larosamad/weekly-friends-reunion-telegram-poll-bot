name: Telegram weekly poll

on:
  schedule:
    # Check saved settings every 15 minutes. GitHub may delay scheduled runs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Operazione (auto rispetta la programmazione salvata)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - start
          - close_first
          - close_tiebreak

permissions:
  contents: write

concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ -z "${BOT_TOKEN//[[:space:]]/}" ] || [ -z "${CHAT_ID//[[:space:]]/}" ]; then
            echo "::error::Aggiungi BOT_TOKEN e CHAT_ID nei Secrets Actions di questa copia del repository."
            exit 1
          fi

      - name: Check poll state and schedule
        id: schedule
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          REQUESTED_MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode }}
        run: python scheduler.py

      - name: Install dependencies
        if: steps.schedule.outputs.mode != ''
        run: pip install -r requirements.txt

      - name: Run bot
        if: steps.schedule.outputs.mode != ''
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MODE: ${{ steps.schedule.outputs.mode }}
        run: python bot.py

      # Preserve an active poll even if a later Telegram operation fails.
      - name: Save poll state
        if: always() && steps.schedule.outcome == 'success'
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for file in poll_info.json schedule_state.json; do
            if [ -f "$file" ]; then
              git add -- "$file"
            else
              git rm --ignore-unmatch -- "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "Nessuna modifica allo stato."
            exit 0
          fi
          git commit -m "Save poll state [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$STATE_BRANCH"
            if git rebase "origin/$STATE_BRANCH"; then
              if git push origin "HEAD:$STATE_BRANCH"; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 3
          done
          echo "::error::Impossibile salvare lo stato. Controlla i permessi di scrittura di Actions."
          exit 1
